<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" 
    href="https://fonts.googleapis.com/css?family=Figtree">
    <style>
        body {
            display: flex;
            justify-content: center;
            background:hsl(47, 88%, 50%);
            font-family: "Figtree", sans-serif;
            
        }
       div {
        padding-left: 10px;
        padding-right: 10px;
        border: 1px solid black;
        width: 39.5%;
        box-sizing: border-box;
        background-color: hsl(0, 0%, 100%);
        border-radius: 8px;
        box-shadow: 10px 10px 10px rgba(0, 0, 0, 1);
        margin-top: 50%;
        margin-bottom: 50%;
        
        
        
       }
       img {
        width: 280px;
        border-radius: 6px;
       }
       .img {
        text-align: center;
        }
        span img {
            width: 25px;
            margin-right: 10px;
        }
        p span {
            display: flex;
            align-items: center;
            font-weight: bolder; 
        }
        h2 {
            color: black;
            font-weight:bolder;
        }
        .p {
            background-color:hsl(47, 88%, 50%);
            width: 75px;
            font-weight: bolder;
            height: 25px;
            text-align: center;
            display:flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }
        h2:hover {
            color: hsl(47, 88%, 50%);
            cursor:pointer;
        }
    </style>
</head>
<body>
    <div>
        <p class="img"><img src="illustration-article.svg" alt="Design"></p>
        <p class="p">learning</p>
        <p>Published 21 Dec 2023</p>
        <h2>HTML & CSS foundations</h2>
        <p>These languages are the backbone of every website, defining structure, content, and presentation</p>
        <p><span><img src="image-avatar.webp" alt="profile">Greg Hooper</span></p>
        
    </div>
    
</body>
</html>
